<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 GAS 기반 웹사이트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f6f9;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 { color: #333; }
        p { color: #666; }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background-color: #3367d6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👋 안녕하세요! 내 깃허브 웹사이트입니다.</h1>
        <p>Google Apps Script(GAS)와 연동을 준비 중입니다.</p>
        <button onclick="testGAS()">GAS 연결 테스트</button>
        <p id="result"></p>
    </div>

    <script>
        function testGAS() {
            document.getElementById("result").innerText = "GAS 연동 기능을 설정할 예정입니다.";
        }
    </script>
</body>
</html>
